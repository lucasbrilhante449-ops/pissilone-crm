<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSN CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --L:#D17543;--L2:#A85528;--L3:#FDF0E8;
  --A:#64A6AC;--A2:#3D7A80;--A3:#E8F4F5;
  --K:#1A1208;--K2:#3D2E1A;
  --W:#FDFAF5;--G:#F0EDE6;--G2:#DDD8D0;--G3:#8A7A6A;
  --VD:#27500A;--VD2:#EAF3DE;
  --RX:#3C3489;--RX2:#EEEDFE;
  --VM:#791F1F;--VM2:#FCEBEB;
  --AM:#633806;--AM2:#FAEEDA;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--G);color:var(--K);font-family:'Barlow',sans-serif;min-height:100vh;font-size:14px}

.hdr{background:var(--K);padding:.75rem 1.25rem;display:flex;align-items:center;gap:.75rem;position:sticky;top:0;z-index:200;flex-wrap:wrap}
.hdr-logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-style:italic;font-size:1.3rem;color:var(--W);letter-spacing:-.01em;white-space:nowrap}
.hdr-logo span{color:var(--L)}
.hdr-right{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.sdot{width:7px;height:7px;border-radius:50%;background:#4CAF50;flex-shrink:0}
.sdot.ld{background:#F2E618;animation:pulse 1s infinite}
.sdot.er{background:#E24B4A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stxt{font-size:11px;color:rgba(255,255,255,.4)}
.hdr-ubtn{font-size:11px;padding:4px 12px;cursor:pointer;border-radius:20px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.5);transition:.15s;font-family:'Barlow',sans-serif}
.hdr-ubtn:hover,.hdr-ubtn.on{background:rgba(255,255,255,.12);color:var(--W)}
.hdr-sync{font-size:16px;padding:3px 8px;cursor:pointer;border-radius:4px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.35)}
.hdr-sync:hover{color:var(--W)}

.tabs-bar{background:var(--K);border-top:1px solid rgba(255,255,255,.06);padding:0 1.25rem}
.tabs{display:flex}
.tb{font-size:12px;font-weight:500;padding:9px 16px;cursor:pointer;border:none;background:none;color:rgba(255,255,255,.35);border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;font-family:'Barlow',sans-serif}
.tb.active{color:var(--L);border-bottom-color:var(--L)}
.tb:hover:not(.active){color:rgba(255,255,255,.7)}

.cnt{padding:1rem;max-width:1300px;margin:0 auto}
.pane{display:none}.pane.active{display:block}

/* BUTTONS */
.btn{font-size:12px;padding:6px 13px;cursor:pointer;border-radius:6px;border:1px solid var(--G2);background:var(--W);color:var(--K);font-family:'Barlow',sans-serif;transition:.15s;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:var(--G)}
.btn.primary{background:var(--K);color:var(--W);border-color:var(--K)}
.btn.primary:hover{background:var(--K2)}
.btn.danger{border-color:var(--VM2);color:var(--VM)}
.btn.danger:hover{background:var(--VM2)}
.btn.sm{font-size:11px;padding:4px 10px}
.btn.xs{font-size:10px;padding:2px 7px}
.btn.full{width:100%;justify-content:center}
.btn.laranja{background:var(--L);color:var(--W);border-color:var(--L)}
.btn.laranja:hover{background:var(--L2)}

/* FORMS */
.flbl{font-size:11px;color:var(--G3);display:block;margin-bottom:3px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.fi{width:100%;padding:7px 10px;font-size:13px;border:1px solid var(--G2);border-radius:6px;background:var(--W);color:var(--K);font-family:'Barlow',sans-serif;outline:none;transition:.15s}
.fi:focus{border-color:var(--L)}
textarea.fi{resize:vertical;min-height:60px}
.fg{display:grid;gap:10px;margin-bottom:10px}
.fg2{grid-template-columns:1fr 1fr}
.fg3{grid-template-columns:1fr 1fr 1fr}
.fg1{grid-template-columns:1fr}
.fcard{background:var(--W);border:1px solid var(--G2);border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.ftitle{font-size:13px;font-weight:600;margin-bottom:1rem;padding-bottom:.625rem;border-bottom:1px solid var(--G2);display:flex;align-items:center;justify-content:space-between}

/* KANBAN */
.funil-sel{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ft{font-size:12px;padding:5px 14px;cursor:pointer;border-radius:20px;border:1px solid var(--G2);background:var(--W);color:var(--G3);transition:.15s;font-weight:500}
.ft.active{background:var(--K);color:var(--W);border-color:var(--K)}
.ft:hover:not(.active){background:var(--G)}

.board-wrap{overflow-x:auto;padding-bottom:.75rem}
.board{display:flex;gap:10px;align-items:flex-start;min-width:max-content}
.kcol{width:200px;flex-shrink:0;background:var(--W);border:1px solid var(--G2);border-radius:10px;display:flex;flex-direction:column}
.kcol.over{border-color:var(--L);background:var(--L3)}
.kcol-hdr{padding:.625rem .875rem;border-bottom:1px solid var(--G2);display:flex;align-items:center;justify-content:space-between;gap:6px}
.kcol-nome{font-size:12px;font-weight:600;color:var(--K);flex:1}
.kcol-cnt{background:var(--G);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--G3);white-space:nowrap}
.kcol-edit{font-size:11px;padding:2px 5px;cursor:pointer;border-radius:4px;border:1px solid var(--G2);background:transparent;color:var(--G3);line-height:1.4}
.kcol-edit:hover{background:var(--G)}
.kcol-body{padding:.5rem;flex:1;min-height:120px}
.kcol-footer{padding:.5rem;border-top:1px solid var(--G2)}
.add-col{width:150px;flex-shrink:0;background:transparent;border:2px dashed var(--G2);border-radius:10px;padding:2rem .75rem;text-align:center;cursor:pointer;color:var(--G3);font-size:12px;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:180px;justify-content:center}
.add-col:hover{border-color:var(--L);color:var(--L);background:var(--L3)}

/* KCARD */
.kc{background:var(--W);border:1px solid var(--G2);border-radius:8px;padding:.625rem .75rem;margin-bottom:6px;cursor:grab;user-select:none;transition:border-color .15s,box-shadow .15s;position:relative}
.kc:hover{border-color:var(--L);box-shadow:0 2px 8px rgba(209,117,67,.12)}
.kc.dragging{opacity:.4;cursor:grabbing}
.kc-nome{font-size:13px;font-weight:500;color:var(--K);margin-bottom:2px}
.kc-sub{font-size:11px;color:var(--G3);display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.kc-actions{display:flex;gap:4px;align-items:center;justify-content:space-between}
.kc-left{display:flex;gap:4px}

/* ATIVIDADE DOT */
.atv-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;cursor:pointer;border:2px solid rgba(0,0,0,.1);transition:transform .15s}
.atv-dot:hover{transform:scale(1.3)}
.atv-verde{background:#4CAF50}
.atv-vermelho{background:#E53935}
.atv-amarelo{background:#FDD835}
.atv-cinza{background:#9E9E9E}

/* CONTATO CARD */
.cc{background:var(--W);border:1px solid var(--G2);border-radius:10px;padding:.875rem 1rem;margin-bottom:8px}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.cc-nome{font-size:14px;font-weight:500;color:var(--K)}
.cc-info{font-size:12px;color:var(--G3);line-height:1.6}

/* FILTROS */
.filtros{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.875rem}
.filtro{font-size:11px;padding:4px 12px;cursor:pointer;border-radius:20px;border:1px solid var(--G2);background:var(--W);color:var(--G3);transition:.15s}
.filtro.active,.filtro:hover{background:var(--K);color:var(--W);border-color:var(--K)}

.bw{position:relative;margin-bottom:.875rem}
.bi{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--G3);pointer-events:none}
.busca-fi{padding-left:30px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--W);border-radius:12px;padding:1.5rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.mtitle{font-size:15px;font-weight:600;color:var(--K);margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between}
.mcl{font-size:18px;cursor:pointer;color:var(--G3);background:none;border:none;padding:2px 6px;line-height:1}
.mcl:hover{color:var(--K)}

/* CHIPS */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem}
.chip{font-size:11px;padding:4px 10px;cursor:pointer;border-radius:20px;border:1px solid var(--G2);background:transparent;color:var(--G3);transition:.15s}
.chip:hover,.chip.sel{background:var(--VM2);color:var(--VM);border-color:var(--VM2)}

/* METRICS */
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:1rem}
.mc{background:var(--W);border:1px solid var(--G2);border-radius:8px;padding:.875rem;text-align:center}
.mc-n{font-size:22px;font-weight:500;color:var(--K);line-height:1}
.mc-l{font-size:11px;color:var(--G3);margin-top:3px}
.mc-s{font-size:11px;font-weight:500;margin-top:2px}
.mc-s.v{color:var(--VD)}.mc-s.a{color:var(--AM)}.mc-s.r{color:var(--VM)}

.bb{margin-bottom:.625rem}
.bb-row{display:flex;justify-content:space-between;font-size:12px;color:var(--G3);margin-bottom:3px}
.bb-row span:last-child{font-weight:500;color:var(--K)}
.bar{height:7px;background:var(--G2);border-radius:4px;overflow:hidden}
.bar-f{height:100%;border-radius:4px;transition:width .4s}

.pbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pb{font-size:11px;padding:4px 12px;cursor:pointer;border-radius:20px;border:1px solid var(--G2);background:var(--W);color:var(--G3);transition:.15s}
.pb.active{background:var(--L);color:var(--W);border-color:var(--L)}

.slbl{font-size:10px;font-weight:700;color:var(--G3);text-transform:uppercase;letter-spacing:.1em;margin:.875rem 0 .5rem}
.divider{height:1px;background:var(--G2);margin:1rem 0}
.empty{text-align:center;padding:2rem 1rem;color:var(--G3);font-size:13px}
.fb{font-size:12px;margin-top:6px;min-height:16px}
.fb.ok{color:var(--VD)}.fb.er{color:var(--VM)}.fb.info{color:var(--G3)}

.bdg-canal{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--G);color:var(--G3);border:1px solid var(--G2);display:inline-block}
.res-ganho{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:#C8E6C9;color:#1B5E20;border:none;cursor:default;display:inline-block}
.res-perda{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:#FFCDD2;color:#B71C1C;border:none;cursor:default;display:inline-block}
.btn-ganho{font-size:10px;padding:2px 8px;cursor:pointer;border-radius:20px;border:1px solid #A5D6A7;background:#F1F8E9;color:#2E7D32;font-family:'Barlow',sans-serif;font-weight:600;transition:.15s}
.btn-ganho:hover{background:#C8E6C9}
.btn-perda{font-size:10px;padding:2px 8px;cursor:pointer;border-radius:20px;border:1px solid #EF9A9A;background:#FFF3F3;color:#C62828;font-family:'Barlow',sans-serif;font-weight:600;transition:.15s}
.btn-perda:hover{background:#FFCDD2}

@media(max-width:600px){
  .fg2,.fg3{grid-template-columns:1fr}
  .mg{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">✳ PSN <span>CRM</span> ✳</div>
  <div class="hdr-right">
    <div id="ubtns" style="display:flex;gap:4px"></div>
    <div style="display:flex;align-items:center;gap:5px">
      <div class="sdot ld" id="sdot"></div>
      <span class="stxt" id="stxt">Conectando...</span>
    </div>
    <button class="hdr-sync" onclick="doSync()" title="Sincronizar">↻</button>
  </div>
</header>

<div class="tabs-bar">
  <div class="tabs">
    <button class="tb active" onclick="showTab('funil')">Funil</button>
    <button class="tb" onclick="showTab('contatos')">Contatos</button>
    <button class="tb" onclick="showTab('insights')">Insights</button>
    <button class="tb" onclick="showTab('config')">Configurar</button>
  </div>
</div>

<div class="cnt">

<!-- FUNIL -->
<div id="pane-funil" class="pane active">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:.875rem;flex-wrap:wrap">
    <div class="funil-sel" id="funil-tabs"></div>
    <button class="btn sm laranja" onclick="openFunilModal(null)">+ Funil</button>
  </div>
  <div class="board-wrap"><div class="board" id="board"></div></div>
</div>

<!-- CONTATOS -->
<div id="pane-contatos" class="pane">
  <div class="bw">
    <span class="bi">⌕</span>
    <input class="fi busca-fi" id="busca" placeholder="Buscar por nome..." oninput="renderContatos()">
  </div>
  <div class="filtros" id="filtros-c"></div>
  <div id="lista-c"></div>
</div>

<!-- INSIGHTS -->
<div id="pane-insights" class="pane">
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:1rem">
    <div class="pbar">
      <button class="pb" onclick="setPer(this,'7')">7d</button>
      <button class="pb active" onclick="setPer(this,'30')">30d</button>
      <button class="pb" onclick="setPer(this,'90')">90d</button>
      <button class="pb" onclick="setPer(this,'0')">Tudo</button>
    </div>
    <select class="fi" style="width:auto;font-size:12px" id="ins-user" onchange="renderInsights()">
      <option value="todos">Todos usuários</option>
    </select>
    <select class="fi" style="width:auto;font-size:12px" id="ins-funil" onchange="renderInsights()">
      <option value="todos">Todos funis</option>
    </select>
  </div>
  <div id="ins-content"></div>
</div>

<!-- CONFIG -->
<div id="pane-config" class="pane">
  <div class="slbl">Funis e Etapas</div>
  <div id="cfg-funis"></div>
  <button class="btn laranja sm" onclick="openFunilModal(null)" style="margin-bottom:1.5rem">+ Novo funil</button>
  <div class="divider"></div>
  <div class="slbl">Usuários</div>
  <div id="cfg-users"></div>
  <button class="btn sm" onclick="openUserModal()">+ Novo usuário</button>
</div>

</div>

<!-- MODAL CONTATO -->
<div class="overlay" id="modal-c" style="display:none">
<div class="modal">
  <div class="mtitle"><span id="mc-title">Novo contato</span><button class="mcl" onclick="closeM('modal-c')">✕</button></div>
  <div class="fg fg2">
    <div><label class="flbl">Nome *</label><input class="fi" id="f-nome" placeholder="Nome do cliente"></div>
    <div><label class="flbl">Telefone</label><input class="fi" id="f-tel" placeholder="(84) 9..."></div>
  </div>
  <div class="fg fg3">
    <div><label class="flbl">Funil</label><select class="fi" id="f-funil" onchange="updEtapas()"></select></div>
    <div><label class="flbl">Etapa</label><select class="fi" id="f-etapa"></select></div>
    <div><label class="flbl">Responsável</label><select class="fi" id="f-user"></select></div>
  </div>
  <div class="fg fg3">
    <div><label class="flbl">Canal</label>
      <select class="fi" id="f-canal">
        <option value="instagram">Instagram</option>
        <option value="story">Story</option>
        <option value="anuncio">Anúncio</option>
        <option value="indicacao">Indicação</option>
        <option value="atelie">Ateliê</option>
        <option value="busca">Google</option>
        <option value="outro">Outro</option>
      </select>
    </div>
    <div><label class="flbl">Valor (R$)</label><input class="fi" type="number" id="f-valor" placeholder="120"></div>
    <div><label class="flbl">Follow-up</label><input class="fi" type="date" id="f-followup"></div>
  </div>
  <div class="fg fg1">
    <div><label class="flbl">Produto</label><input class="fi" id="f-produto" placeholder="Kit Nordeste Vivo..."></div>
  </div>
  <div class="fg fg1">
    <div><label class="flbl">Observação</label><textarea class="fi" id="f-obs"></textarea></div>
  </div>
  <div id="reabrir-wrap" style="display:none;margin-bottom:.75rem">
    <button class="btn full" style="border-color:var(--AM);color:var(--AM)" onclick="reabrirCard()">↺ Reabrir card (remover ganho/perda)</button>
  </div>
  <button class="btn primary full" id="btn-sc" onclick="saveContato()">Salvar contato</button>
  <div class="fb" id="fb-c"></div>
</div>
</div>

<!-- MODAL PERDA -->
<div class="overlay" id="modal-perda" style="display:none">
<div class="modal">
  <div class="mtitle"><span>Motivo de perda</span><button class="mcl" onclick="closeM('modal-perda')">✕</button></div>
  <p style="font-size:12px;color:var(--G3);margin-bottom:.75rem">Selecione o motivo:</p>
  <div class="chips">
    <button class="chip" onclick="selM(this,'Preço alto')">Preço alto</button>
    <button class="chip" onclick="selM(this,'Não respondeu')">Não respondeu</button>
    <button class="chip" onclick="selM(this,'Comprou em outro lugar')">Outro lugar</button>
    <button class="chip" onclick="selM(this,'Não tinha tamanho')">Sem tamanho</button>
    <button class="chip" onclick="selM(this,'Prazo muito longo')">Prazo longo</button>
    <button class="chip" onclick="selM(this,'Mudou de ideia')">Mudou de ideia</button>
    <button class="chip" onclick="selM(this,'Sem dinheiro agora')">Sem dinheiro</button>
    <button class="chip" onclick="selM(this,'Frete caro')">Frete caro</button>
  </div>
  <div class="fg fg1" style="margin-bottom:1rem">
    <div><label class="flbl">Outro motivo</label><input class="fi" id="f-motivo" placeholder="Descreva..."></div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn danger full" onclick="confirmPerda()">Confirmar perda</button>
    <button class="btn full" onclick="cancelPerda()">Cancelar</button>
  </div>
</div>
</div>

<!-- MODAL ATIVIDADE -->
<div class="overlay" id="modal-atv" style="display:none">
<div class="modal">
  <div class="mtitle"><span id="atv-nome">Atividade</span><button class="mcl" onclick="closeM('modal-atv')">✕</button></div>
  <div class="fg fg1" style="margin-bottom:.75rem">
    <div><label class="flbl">Data da atividade *</label><input class="fi" type="date" id="f-atv-data"></div>
  </div>
  <div class="fg fg1" style="margin-bottom:1rem">
    <div><label class="flbl">Descrição</label><input class="fi" id="f-atv-desc" placeholder="Ex: Ligar, enviar proposta..."></div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn primary full" onclick="saveAtv()">Salvar</button>
    <button class="btn full" onclick="clearAtv()">Remover atividade</button>
  </div>
</div>
</div>

<!-- MODAL FUNIL -->
<div class="overlay" id="modal-funil" style="display:none">
<div class="modal">
  <div class="mtitle"><span id="mf-title">Novo funil</span><button class="mcl" onclick="closeM('modal-funil')">✕</button></div>
  <div class="fg fg1" style="margin-bottom:1rem">
    <div><label class="flbl">Nome do funil</label><input class="fi" id="f-funil-nome" placeholder="Ex: D2C, B2B..."></div>
  </div>
  <button class="btn primary full" onclick="saveFunil()">Salvar</button>
  <div class="fb" id="fb-f"></div>
</div>
</div>

<!-- MODAL ETAPA -->
<div class="overlay" id="modal-etapa" style="display:none">
<div class="modal">
  <div class="mtitle"><span id="me-title">Nova etapa</span><button class="mcl" onclick="closeM('modal-etapa')">✕</button></div>
  <div class="fg fg1" style="margin-bottom:1rem">
    <div><label class="flbl">Nome da etapa</label><input class="fi" id="f-etapa-nome" placeholder="Ex: Atendimento, Proposta..."></div>
  </div>
  <button class="btn primary full" onclick="saveEtapa()">Salvar</button>
</div>
</div>

<!-- MODAL USUARIO -->
<div class="overlay" id="modal-user" style="display:none">
<div class="modal">
  <div class="mtitle"><span>Novo usuário</span><button class="mcl" onclick="closeM('modal-user')">✕</button></div>
  <div class="fg fg1" style="margin-bottom:1rem">
    <div><label class="flbl">Nome</label><input class="fi" id="f-user-nome" placeholder="Ex: Lucas, Ana..."></div>
  </div>
  <button class="btn primary full" onclick="saveUser()">Salvar</button>
</div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxrJTFMTbOyw9UwIz0RMhkF6lGGVsHznllBPo5uKlGrAyxb028SAlW0z2arpvEtShueRg/exec';

// ── STATE ──────────────────────────────────────────────
let contatos = [];
let cfg = {
  funis: [
    {id:'d2c', nome:'D2C', etapas:[

// ── SYNC STATUS ────────────────────────────────────────
function ss(s, m) {
  document.getElementById('sdot').className = 'sdot' + (s==='ld'?' ld': s==='er'?' er':'');
  document.getElementById('stxt').textContent = m;
}

// ── CONFIG PERSIST ─────────────────────────────────────
function loadCfg() {
  try { const s = localStorage.getItem('psn_cfg3'); if(s) cfg = JSON.parse(s); } catch(e){}
}
function saveCfg() { localStorage.setItem('psn_cfg3', JSON.stringify(cfg)); }

// ── API ────────────────────────────────────────────────
async function apiPost(payload) {
  const r = await fetch(API, {
    method: 'POST',
    body: JSON.stringify(payload)
  });
  const text = await r.text();
  try { return JSON.parse(text); } catch(e) { return {}; }
}

async function doSync() {
  ss('ld','Sincronizando...');
  try {
    const rows = await apiPost({action:'getAll'});
    if (!Array.isArray(rows) || rows.length < 2) {
      contatos = [];
    } else {
      contatos = rows.slice(1)
        .filter(r => r[0])
        .map(r => ({
          id:           String(r[0]  || ''),
          nome:         String(r[1]  || ''),
          tel:          String(r[2]  || ''),
          et:           String(r[3]  || ''),
          canal:        String(r[4]  || 'outro'),
          valor:        parseFloat(r[5]) || 0,
          produto:      String(r[6]  || ''),
          obs:          String(r[7]  || ''),
          data:         String(r[8]  || new Date().toISOString()),
          compras:      parseInt(r[9])  || 0,
          funil:        String(r[10] || 'd2c'),
          etapa:        String(r[11] || 'd2c-novo'),
          usuario:      String(r[12] || ''),
          followup:     String(r[13] || ''),
          motivo_perda: String(r[14] || ''),
          atv_data:     String(r[15] || ''),
          atv_desc:     String(r[16] || ''),
          resultado:    String(r[17] || '')
        }));
    }
    ss('ok', contatos.length + ' contato' + (contatos.length !== 1 ? 's' : ''));
    renderAll();
  } catch(e) {
    ss('er', 'Erro de conexão');
    console.error(e);
  }
}

function contatoPayload(c) {
  return {
    id: c.id, nome: c.nome, tel: c.tel, et: c.et,
    canal: c.canal, valor: c.valor, produto: c.produto,
    obs: c.obs, data: c.data, compras: c.compras,
    funil: c.funil, etapa: c.etapa, usuario: c.usuario,
    followup: c.followup, motivo_perda: c.motivo_perda || '',
    atv_data: c.atv_data || '', atv_desc: c.atv_desc || '',
    resultado: c.resultado || ''
  };
}

async function apiSave(c)   { return apiPost({action:'save',   contato: contatoPayload(c)}); }
async function apiDelete(id){ return apiPost({action:'delete', id: String(id)}); }

// ── HELPERS ────────────────────────────────────────────
function getFunil(id)       { return cfg.funis.find(f => f.id === id); }
function getEtapa(fid, eid) { const f = getFunil(fid); return f ? f.etapas.find(e => e.id === eid) : null; }
function fmtD(iso)          { try { return new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); } catch(e) { return ''; } }

function isGanho(fid, eid) {
  const e = getEtapa(fid, eid);
  return e && e.nome.toLowerCase().includes('fechado');
}
function isPerdido(fid, eid) {
  const e = getEtapa(fid, eid);
  return e && e.nome.toLowerCase().includes('perdido');
}
function isBoasVindas(fid, eid) {
  const e = getEtapa(fid, eid);
  return e && e.nome.toLowerCase().includes('boas vindas');
}
function isNegociacao(fid, eid) {
  const e = getEtapa(fid, eid);
  return e && e.nome.toLowerCase().includes('negociação comercial');
}

function atvStatus(c) {
  if (!c.atv_data) return 'sem';
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const d    = new Date(c.atv_data + 'T00:00:00');
  if (d < hoje)                     return 'atrasada';
  if (d.getTime() === hoje.getTime()) return 'hoje';
  return 'agendada';
}

function atvDotHtml(c) {
  const s   = atvStatus(c);
  const cls = {sem:'atv-vermelho', hoje:'atv-verde', atrasada:'atv-amarelo', agendada:'atv-cinza'};
  const tip = {sem:'Sem atividade — clique para agendar', hoje:`Hoje: ${c.atv_desc||'atividade agendada'}`, atrasada:`Atrasada (${fmtD(c.atv_data)}): ${c.atv_desc||''}`, agendada:`${fmtD(c.atv_data)}: ${c.atv_desc||''}`};
  return `<div class="atv-dot ${cls[s]}" title="${tip[s]}" onclick="openAtv('${c.id}')"></div>`;
}

// ── TABS ───────────────────────────────────────────────
function showTab(id) {
  ['funil','contatos','insights','config'].forEach((t,i) => {
    document.querySelectorAll('.tb')[i].classList.toggle('active', t===id);
    document.getElementById('pane-'+t).classList.toggle('active', t===id);
  });

}

// ── FUNIL BOARD ────────────────────────────────────────
function renderFunilTabs() {
  document.getElementById('funil-tabs').innerHTML =
    cfg.funis.map(f =>
      `<button class="ft${funilAtivo===f.id?' active':''}" onclick="setFunil('${f.id}')">${f.nome}</button>`
    ).join('');
}

function setFunil(id) { funilAtivo = id; renderFunil(); }

function renderFunil() {
  renderFunilTabs();
  const funil = getFunil(funilAtivo);
  const board = document.getElementById('board');
  board.innerHTML = '';
  if (!funil) { board.innerHTML = '<div class="empty">Nenhum funil</div>'; return; }

  funil.etapas.forEach(etapa => {
    // filtra contatos desta coluna
    const cards = contatos.filter(c =>
      c.funil === funilAtivo &&
      c.etapa === etapa.id  &&
      (userAtivo === 'todos' || c.usuario === userAtivo)
    );

    const col = document.createElement('div');
    col.className = 'kcol';
    col.dataset.etapa = etapa.id;

    col.innerHTML = `
      <div class="kcol-hdr">
        <span class="kcol-nome">${etapa.nome}</span>
        <span class="kcol-cnt">${cards.length}</span>
        <button class="kcol-edit" onclick="openEtapaModal('${funil.id}','${etapa.id}')">✎</button>
      </div>
      <div class="kcol-body" id="cb-${etapa.id}">
        ${cards.map(c => kcardHtml(c)).join('')}
      </div>
      <div class="kcol-footer">
        <button class="btn xs full" onclick="openContato(null,'${funil.id}','${etapa.id}')">+ Contato</button>
      </div>`;

    // drag events on col-body
    const body = col.querySelector('.kcol-body');
    body.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    body.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    body.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('over');
      if (dragId) dropCard(etapa.id);
    });

    board.appendChild(col);
  });

  // add col button
  const addBtn = document.createElement('div');
  addBtn.className = 'add-col';
  addBtn.onclick = () => openEtapaModal(funil.id, null);
  addBtn.innerHTML = '<span style="font-size:22px">+</span><span>Nova etapa</span>';
  board.appendChild(addBtn);

  // bind drag on cards
  board.querySelectorAll('.kc').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragId = el.dataset.id;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      document.querySelectorAll('.kcol').forEach(c => c.classList.remove('over'));
    });
  });
}

function kcardHtml(c) {
  const usr = cfg.usuarios.find(u => u.id === c.usuario);
  const vl  = c.valor ? `R$${Math.round(c.valor)}` : '';
  const res = c.resultado;
  // Botões ganho/perda — só mostrar se card está em negociação
  const emNeg = isNegociacao(c.funil, c.etapa);
  let botoesRes = '';
  if (res === 'ganho') {
    botoesRes = `<span class="res-ganho">✓ Ganho</span>`;
  } else if (res === 'perda') {
    botoesRes = `<span class="res-perda">✗ Perda</span>`;
  } else if (emNeg) {
    botoesRes = `<button class="btn-ganho" onclick="setResultado('${c.id}','ganho')">✓ Ganho</button>`
              + `<button class="btn-perda" onclick="setResultado('${c.id}','perda')">✗ Perda</button>`;
  }
  return `<div class="kc" draggable="true" data-id="${c.id}">
    <div class="kc-nome">${c.nome}</div>
    <div class="kc-sub">
      ${vl ? `<span>${vl}</span>` : ''}
      ${c.canal ? `<span>${CANAL_LABEL[c.canal]||c.canal}</span>` : ''}
      ${usr ? `<span>👤 ${usr.nome}</span>` : ''}
    </div>
    ${botoesRes ? `<div style="margin-bottom:5px;display:flex;gap:4px;flex-wrap:wrap">${botoesRes}</div>` : ''}
    ${c.motivo_perda ? `<div style="font-size:10px;color:var(--VM);margin-bottom:4px">⚠ ${c.motivo_perda}</div>` : ''}
    <div class="kc-actions">
      <div class="kc-left" style="flex-wrap:wrap;gap:3px">
        <button class="btn xs" onclick="openContato('${c.id}')" title="Editar">✎</button>
        <button class="btn xs" onclick="duplicarCard('${c.id}')" title="Duplicar para Pissifã">⧉</button>
        <button class="btn xs danger" onclick="delC('${c.id}')" title="Excluir">✕</button>
      </div>
      ${atvDotHtml(c)}
    </div>
  </div>`;
}

// ── DRAG & DROP ────────────────────────────────────────
async function dropCard(etapaId) {
  if (!dragId) return;
  const c = contatos.find(x => x.id === dragId);
  if (!c) return;

  if (isPerdido(funilAtivo, etapaId)) {
    c.etapa       = etapaId;
    c.et          = 'perdido';
    perdaCid      = dragId;
    dragId        = null;
    document.getElementById('modal-perda').style.display = 'flex';
    return;
  }

  c.etapa = etapaId;
  c.et    = isGanho(funilAtivo, etapaId) ? 'fechado' : 'atendimento';
  dragId  = null;
  ss('ld', 'Movendo...');
  try { await apiSave(c); await doSync(); }
  catch(ex) { ss('er','Erro ao mover'); console.error(ex); }
}

// ── PERDA MODAL ────────────────────────────────────────
function selM(btn, m) {
  document.querySelectorAll('.chip').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  motivoSel = m;
}

async function confirmPerda() {
  const outro  = document.getElementById('f-motivo').value.trim();
  const motivo = outro || motivoSel || 'Não informado';
  const c      = contatos.find(x => x.id === perdaCid);
  if (!c) { closeM('modal-perda'); return; }
  c.motivo_perda = motivo;
  c.et           = 'perdido';
  c.resultado    = 'perda';
  ss('ld', 'Salvando...');
  try { await apiSave(c); await doSync(); }
  catch(ex) { ss('er','Erro'); console.error(ex); }
  closeM('modal-perda');
  motivoSel = '';
  document.getElementById('f-motivo').value = '';
  document.querySelectorAll('.chip').forEach(b => b.classList.remove('sel'));
  perdaCid = null;
}

function cancelPerda() {
  // reverter etapa — refaz render sem salvar
  perdaCid = null;
  closeM('modal-perda');
  renderFunil();
}

// ── RESULTADO (GANHO / PERDA) ─────────────────────────
async function setResultado(id, resultado) {
  const c = contatos.find(x => x.id === id);
  if (!c) return;
  if (resultado === 'perda') {
    perdaCid = id;
    c.resultado = 'perda';
    document.getElementById('modal-perda').style.display = 'flex';
    return;
  }
  // ganho direto
  c.resultado    = 'ganho';
  c.et           = 'fechado';
  c.motivo_perda = '';
  ss('ld','Salvando ganho...');
  try { await apiSave(c); await doSync(); }
  catch(ex) { ss('er','Erro ao salvar'); console.error(ex); }
}

// ── DUPLICAR CARD → PISSIFÃ ────────────────────────────
async function duplicarCard(id) {
  const orig = contatos.find(x => x.id === id);
  if (!orig) return;
  const funilPsf = getFunil('pissifa');
  if (!funilPsf) {
    alert('Funil Pissifã não encontrado. Crie um funil chamado "Pissifã" primeiro.');
    return;
  }
  const primeiraEtapa = funilPsf.etapas[0];
  if (!confirm(`Duplicar "${orig.nome}" para o funil Pissifã?`)) return;
  const novo = {
    id:           String(Date.now()),
    nome:         orig.nome,
    tel:          orig.tel,
    et:           'atendimento',
    canal:        orig.canal,
    valor:        orig.valor,
    produto:      orig.produto,
    obs:          orig.obs,
    data:         new Date().toISOString(),
    compras:      orig.compras,
    funil:        'pissifa',
    etapa:        primeiraEtapa.id,
    usuario:      orig.usuario,
    followup:     '',
    motivo_perda: '',
    atv_data:     '',
    atv_desc:     '',
    resultado:    ''
  };
  ss('ld','Duplicando...');
  try { await apiSave(novo); await doSync(); }
  catch(ex) { ss('er','Erro ao duplicar'); console.error(ex); }
}

// ── REABRIR CARD ──────────────────────────────────────
async function reabrirCard() {
  if (!editCid) return;
  const c = contatos.find(x => x.id === editCid);
  if (!c) return;
  if (!confirm('Reabrir card? O resultado (ganho/perda) será removido.')) return;
  c.resultado    = '';
  c.et           = 'atendimento';
  c.motivo_perda = '';
  ss('ld','Reabrindo...');
  try {
    await apiSave(c);
    await doSync();
    closeM('modal-c');
  } catch(ex) { ss('er','Erro'); console.error(ex); }
}

// ── ATIVIDADE ──────────────────────────────────────────
function openAtv(id) {
  atvCid = id;
  const c = contatos.find(x => x.id === id);
  document.getElementById('atv-nome').textContent = c ? `Atividade — ${c.nome}` : 'Atividade';

  document.getElementById('f-atv-desc').value  = c ? (c.atv_desc  || '') : '';

}

async function saveAtv() {

  c.atv_data = document.getElementById('f-atv-data').value;
  c.atv_desc = document.getElementById('f-atv-desc').value.trim();

  catch(ex) { ss('er','Erro'); console.error(ex); }

async function clearAtv() {
  const c = contatos.find(x => x.id === atvCid);
  if (!c) return;
  c.atv_data = '';

// ── CONTATO MODAL ──────────────────────────────────────
function openContato(id = null, fid = null, eid = null) {
  editCid = id;
  const c = id ? contatos.find(x => x.id === id) : null;

  document.getElementById('mc-title').textContent  = id ? 'Editar contato' : 'Novo contato';
  document.getElementById('btn-sc').textContent    = id ? 'Salvar alterações' : 'Salvar contato';
  document.getElementById('fb-c').textContent      = '';
  document.getElementById('btn-sc').disabled       = false;

  // preencher funis
  const fs = document.getElementById('f-funil');
  fs.innerHTML = cfg.funis.map(f => `<option value="${f.id}">${f.nome}</option>`).join('');
  fs.value = c ? c.funil : (fid || funilAtivo);
  updEtapas();

  // preencher usuários
  const us = document.getElementById('f-user');
  us.innerHTML = '<option value="">Nenhum</option>' +
    cfg.usuarios.map(u => `<option value="${u.id}">${u.nome}</option>`).join('');

  if (c) {
    document.getElementById('f-nome').value    = c.nome;
    document.getElementById('f-tel').value     = c.tel     || '';
    document.getElementById('f-funil').value   = c.funil;
    updEtapas();
    setTimeout(() => { document.getElementById('f-etapa').value = c.etapa; }, 20);
    document.getElementById('f-canal').value   = c.canal   || 'instagram';
    document.getElementById('f-valor').value   = c.valor   || '';
    document.getElementById('f-followup').value= c.followup|| '';
    document.getElementById('f-produto').value = c.produto || '';
    document.getElementById('f-obs').value     = c.obs     || '';
    document.getElementById('f-user').value    = c.usuario || '';
  } else {
    ['f-nome','f-tel','f-valor','f-followup','f-produto','f-obs'].forEach(x => document.getElementById(x).value = '');
    document.getElementById('f-canal').value = 'instagram';
    document.getElementById('f-user').value  = '';
    if (eid) setTimeout(() => { document.getElementById('f-etapa').value = eid; }, 30);
  }

  // Mostrar botão reabrir se card tem resultado definido
  const rw = document.getElementById('reabrir-wrap');
  if (rw) rw.style.display = (c && c.resultado) ? 'block' : 'none';
  document.getElementById('modal-c').style.display = 'flex';
}

function updEtapas() {
  const funil = getFunil(document.getElementById('f-funil').value);
  document.getElementById('f-etapa').innerHTML =
    funil ? funil.etapas.map(e => `<option value="${e.id}">${e.nome}</option>`).join('') : '';
}

async function saveContato() {
  const nome = document.getElementById('f-nome').value.trim();
  if (!nome) { setFb('fb-c','Nome obrigatório','er'); return; }

  setFb('fb-c','Salvando...','info');
  document.getElementById('btn-sc').disabled = true;

  const prev = editCid ? (contatos.find(x => x.id === editCid) || {}) : {};
  const fid  = document.getElementById('f-funil').value;
  const eid  = document.getElementById('f-etapa').value;

  const c = {
    id:           editCid || String(Date.now()),
    nome,
    tel:          document.getElementById('f-tel').value.trim(),
    et:           isGanho(fid,eid) ? 'fechado' : isPerdido(fid,eid) ? 'perdido' : 'atendimento',
    canal:        document.getElementById('f-canal').value,
    valor:        parseFloat(document.getElementById('f-valor').value) || 0,
    produto:      document.getElementById('f-produto').value.trim(),
    obs:          document.getElementById('f-obs').value.trim(),
    data:         prev.data         || new Date().toISOString(),
    compras:      prev.compras      || 0,
    funil:        fid,
    etapa:        eid,
    usuario:      document.getElementById('f-user').value,
    followup:     document.getElementById('f-followup').value,
    motivo_perda: prev.motivo_perda || '',
    atv_data:     prev.atv_data     || '',
    atv_desc:     prev.atv_desc     || ''
  };

  try {
    await apiSave(c);
    setFb('fb-c','Salvo!','ok');
    closeM('modal-c');
    await doSync();
  } catch(ex) {
    setFb('fb-c','Erro ao salvar','er');
    console.error(ex);
  }
  document.getElementById('btn-sc').disabled = false;
}

// DELETE — função global, chamada pelo onclick do card
window.delC = async function(id) {
  if (!confirm('Remover este contato?')) return;
  ss('ld','Removendo...');
  try {
    await apiDelete(id);
    // remove localmente enquanto sync não volta
    contatos = contatos.filter(c => c.id !== id);
    renderFunil();
    renderContatos();
    await doSync();
  } catch(ex) {
    ss('er','Erro ao remover');
    console.error(ex);
  }
};

// ── CONTATOS LIST ──────────────────────────────────────
function renderContatos() {
  const funil = getFunil(funilAtivo);
  const fc = document.getElementById('filtros-c');
  fc.innerHTML = `<button class="filtro${filtroC==='todos'?' active':''}" onclick="setFiltroC(this,'todos')">Todos</button>`;
  if (funil) funil.etapas.forEach(e => {
    fc.innerHTML += `<button class="filtro${filtroC===e.id?' active':''}" onclick="setFiltroC(this,'${e.id}')">${e.nome}</button>`;
  });

  const busca = (document.getElementById('busca')||{value:''}).value.toLowerCase();
  const lista = contatos.filter(c =>
    (filtroC==='todos' || c.etapa===filtroC) &&
    (!busca || c.nome.toLowerCase().includes(busca)) &&
    (userAtivo==='todos' || c.usuario===userAtivo)
  );

  const el = document.getElementById('lista-c');
  if (!lista.length) {
    el.innerHTML = `<div class="empty">${contatos.length ? 'Nenhum encontrado' : 'Nenhum contato ainda'}</div>`;
    return;
  }

  el.innerHTML = lista.map(c => {
    const f = getFunil(c.funil);
    const e = f ? f.etapas.find(x => x.id === c.etapa) : null;
    const u = cfg.usuarios.find(x => x.id === c.usuario);
    const s = atvStatus(c);
    const atvCls = {sem:'atv-vermelho',hoje:'atv-verde',atrasada:'atv-amarelo',agendada:'atv-cinza'};
    return `<div class="cc">
      <div class="cc-top">
        <div>
          <div class="cc-nome">${c.nome}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">
            ${f ? `<span class="bdg-canal">${f.nome}</span>` : ''}
            ${e ? `<span class="bdg-canal">${e.nome}</span>` : ''}
            <span class="bdg-canal">${CANAL_LABEL[c.canal]||c.canal}</span>
            ${c.valor ? `<span class="bdg-canal">R$${Math.round(c.valor)}</span>` : ''}
            ${u ? `<span class="bdg-canal">👤 ${u.nome}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <div class="atv-dot ${atvCls[s]}" onclick="openAtv('${c.id}')" title="Atividade"></div>
          <button class="btn xs" onclick="openContato('${c.id}')">✎</button>
          <button class="btn xs danger" onclick="delC('${c.id}')">✕</button>
        </div>
      </div>
      <div class="cc-info">
        ${c.tel     ? `📞 ${c.tel} &nbsp;` : ''}
        ${c.produto ? `👕 ${c.produto} &nbsp;` : ''}
        📅 ${fmtD(c.data)}
        ${c.motivo_perda ? `<div style="color:var(--VM);margin-top:2px">⚠ Perda: ${c.motivo_perda}</div>` : ''}
        ${c.obs ? `<div style="font-style:italic;margin-top:2px">"${c.obs}"</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function setFiltroC(btn, f) {
  document.querySelectorAll('#filtros-c .filtro').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtroC = f;
  renderContatos();
}

// ── INSIGHTS ───────────────────────────────────────────
function setPer(btn, p) {
  document.querySelectorAll('.pb').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  periodo = p;
  renderInsights();
}

function filtPer(lista) {
  if (periodo === '0') return lista;
  const d = new Date(); d.setDate(d.getDate() - parseInt(periodo));
  return lista.filter(c => new Date(c.data) >= d);
}

function renderInsights() {
  // atualizar selects
  const su = document.getElementById('ins-user');
  if (su) su.innerHTML = '<option value="todos">Todos usuários</option>' +
    cfg.usuarios.map(u => `<option value="${u.id}">${u.nome}</option>`).join('');
  const sf = document.getElementById('ins-funil');
  if (sf) sf.innerHTML = '<option value="todos">Todos funis</option>' +
    cfg.funis.map(f => `<option value="${f.id}">${f.nome}</option>`).join('');

  const iUser  = (document.getElementById('ins-user')  || {value:'todos'}).value;
  const iFunil = (document.getElementById('ins-funil') || {value:'todos'}).value;

  let lista = filtPer(contatos);
  if (iUser  !== 'todos') lista = lista.filter(c => c.usuario === iUser);
  if (iFunil !== 'todos') lista = lista.filter(c => c.funil   === iFunil);

  const total    = lista.length;
  // Ganhos e perdidos por resultado marcado manualmente
  const ganhos   = lista.filter(c => c.resultado === 'ganho');
  const perdidos = lista.filter(c => c.resultado === 'perda');
  const receita  = ganhos.reduce((a,b) => a + (b.valor||0), 0);

  // Abordados = cards que passaram por "Boas Vindas" (qualquer funil D2C)
  const abordados = lista.filter(c => {
    // conta quem está em boas vindas OU já passou (ganho/perda/negociação)
    const f = getFunil(c.funil);
    if (!f) return false;
    // se tem resultado = já foi abordado
    if (c.resultado) return true;
    // se está em boas vindas ou além = abordado
    const etapaIdx = f.etapas.findIndex(e => e.id === c.etapa);
    const bvIdx    = f.etapas.findIndex(e => e.nome.toLowerCase().includes('boas vindas'));
    return bvIdx >= 0 && etapaIdx >= bvIdx;
  });

  // Base para % = cards que entraram em Negociação Comercial
  const emNegociacao = lista.filter(c => {
    const f = getFunil(c.funil);
    if (!f) return false;
    if (c.resultado) return true; // já teve resultado = passou por negociação
    const etapaIdx = f.etapas.findIndex(e => e.id === c.etapa);
    const negIdx   = f.etapas.findIndex(e => e.nome.toLowerCase().includes('negociação comercial'));
    return negIdx >= 0 && etapaIdx >= negIdx;
  });

  const baseConv = emNegociacao.length;
  const txConv   = baseConv > 0 ? Math.round((ganhos.length   / baseConv) * 100) : 0;
  const txPerda  = baseConv > 0 ? Math.round((perdidos.length / baseConv) * 100) : 0;
  const tkMedio  = ganhos.length > 0 ? Math.round(receita / ganhos.length) : 0;
  const emAberto = lista.filter(c => !c.resultado && !isGanho(c.funil,c.etapa) && !isPerdido(c.funil,c.etapa)).length;

  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const atvH = lista.filter(c => { if(!c.atv_data) return false; const d=new Date(c.atv_data+'T00:00:00'); return d.getTime()===hoje.getTime(); }).length;
  const atvA = lista.filter(c => { if(!c.atv_data) return false; const d=new Date(c.atv_data+'T00:00:00'); return d<hoje; }).length;

  const mc = {}; perdidos.forEach(c => { if(c.motivo_perda) mc[c.motivo_perda] = (mc[c.motivo_perda]||0)+1; });
  const topM  = Object.entries(mc).sort((a,b) => b[1]-a[1]);
  const maxM  = Math.max(1,...Object.values(mc));

  const cc = {}; lista.forEach(c => { const k=c.canal||'outro'; cc[k]=(cc[k]||0)+1; });
  const maxC = Math.max(1,...Object.values(cc));

  const fc2 = {}; lista.forEach(c => { const f=getFunil(c.funil); if(f) fc2[f.nome]=(fc2[f.nome]||0)+1; });
  const maxF2 = Math.max(1,...Object.values(fc2));

  document.getElementById('ins-content').innerHTML = `
    <div class="mg">
      <div class="mc"><div class="mc-n">${total}</div><div class="mc-l">Total contatos</div></div>
      <div class="mc"><div class="mc-n">${abordados.length}</div><div class="mc-l">Abordados</div><div class="mc-s v">Boas Vindas+</div></div>
      <div class="mc"><div class="mc-n">${baseConv}</div><div class="mc-l">Em negociação</div></div>
      <div class="mc"><div class="mc-n">${emAberto}</div><div class="mc-l">Em aberto</div></div>
      <div class="mc"><div class="mc-n">${ganhos.length}</div><div class="mc-l">Ganhos</div><div class="mc-s v">✓</div></div>
      <div class="mc"><div class="mc-n">${perdidos.length}</div><div class="mc-l">Perdidos</div><div class="mc-s r">✗</div></div>
      <div class="mc"><div class="mc-n">${txConv}%</div><div class="mc-l">Tx. conversão</div>
        <div class="mc-s ${txConv>=15?'v':txConv>=8?'a':'r'}">${txConv>=15?'Boa':txConv>=8?'Regular':'Baixa'}</div></div>
      <div class="mc"><div class="mc-n">${txPerda}%</div><div class="mc-l">Tx. perda</div>
        <div class="mc-s ${txPerda<=30?'v':'r'}">${txPerda<=30?'Ok':'Alta'}</div></div>
      <div class="mc"><div class="mc-n">R$${Math.round(receita).toLocaleString('pt-BR')}</div><div class="mc-l">Receita</div></div>
      <div class="mc"><div class="mc-n">R$${tkMedio.toLocaleString('pt-BR')}</div><div class="mc-l">Ticket médio</div></div>
      <div class="mc"><div class="mc-n">${atvH}</div><div class="mc-l">Ativ. hoje</div><div class="mc-s v">Fazer hoje</div></div>
      <div class="mc"><div class="mc-n">${atvA}</div><div class="mc-l">Atrasadas</div><div class="mc-s ${atvA>0?'r':'v'}">${atvA>0?'Atenção':'Ok'}</div></div>
    </div>
    <div style="background:var(--G);border-radius:6px;padding:.75rem 1rem;font-size:12px;color:var(--G3);margin-bottom:1rem">
      📊 Taxas calculadas sobre <strong style="color:var(--K)">${baseConv} card${baseConv!==1?'s':''}</strong> que entraram em Negociação Comercial
      ${baseConv===0?'<span style="color:var(--AM)"> — nenhum card em negociação ainda</span>':''}
    </div>
    <div class="divider"></div>
    <div class="slbl">Motivos de perda</div>
    ${topM.length
      ? topM.slice(0,8).map(([m,n]) => `<div class="bb"><div class="bb-row"><span>${m}</span><span>${n}</span></div><div class="bar"><div class="bar-f" style="width:${Math.round((n/maxM)*100)}%;background:#E24B4A"></div></div></div>`).join('')
        + (topM[0] ? `<div style="background:var(--VM2);border-radius:6px;padding:.625rem 1rem;font-size:12px;color:var(--VM);margin-top:.5rem">⚠ Principal motivo: <strong>${topM[0][0]}</strong> (${topM[0][1]}x)</div>` : '')
      : '<div class="empty">Nenhuma perda no período</div>'}
    <div class="divider"></div>
    <div class="slbl">Por canal</div>
    ${Object.entries(cc).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="bb"><div class="bb-row"><span>${CANAL_LABEL[k]||k}</span><span>${n}</span></div><div class="bar"><div class="bar-f" style="width:${Math.round((n/maxC)*100)}%;background:var(--A)"></div></div></div>`).join('')||'<div class="empty">Sem dados</div>'}
    <div class="divider"></div>
    <div class="slbl">Por funil</div>
    ${Object.entries(fc2).map(([nome,n])=>`<div class="bb"><div class="bb-row"><span>${nome}</span><span>${n}</span></div><div class="bar"><div class="bar-f" style="width:${Math.round((n/maxF2)*100)}%;background:var(--L)"></div></div></div>`).join('')||'<div class="empty">Sem dados</div>'}
  `;
}

// ── CONFIG ─────────────────────────────────────────────
function renderConfig() {
  document.getElementById('cfg-funis').innerHTML = cfg.funis.map(f => `
    <div class="fcard">
      <div class="ftitle">
        <span>${f.nome}</span>
        <div style="display:flex;gap:6px">
          <button class="btn sm" onclick="openFunilModal('${f.id}')">Renomear</button>
          <button class="btn sm danger" onclick="delFunil('${f.id}')">Apagar</button>
        </div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${f.etapas.map(e => `
          <div style="display:flex;align-items:center;gap:4px;background:var(--G);border-radius:6px;padding:4px 8px">
            <span style="font-size:12px">${e.nome}</span>
            <button class="btn xs" onclick="openEtapaModal('${f.id}','${e.id}')">✎</button>
            <button class="btn xs danger" onclick="delEtapa('${f.id}','${e.id}')">✕</button>
          </div>`).join('')}
        <button class="btn xs" onclick="openEtapaModal('${f.id}',null)">+ Etapa</button>
      </div>
    </div>`).join('');

  document.getElementById('cfg-users').innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.75rem">
      ${cfg.usuarios.map(u => `
        <div style="display:flex;align-items:center;gap:6px;background:var(--G);border-radius:20px;padding:5px 12px">
          <span style="font-size:12px">👤 ${u.nome}</span>
          <button class="btn xs danger" onclick="delUser('${u.id}')">✕</button>
        </div>`).join('')}
    </div>`;
}

// ── FUNIL / ETAPA / USER MODALS ────────────────────────
function openFunilModal(fid = null) {
  editFid = fid;
  const f = fid ? getFunil(fid) : null;
  document.getElementById('mf-title').textContent  = fid ? 'Renomear funil' : 'Novo funil';
  document.getElementById('f-funil-nome').value     = f ? f.nome : '';
  document.getElementById('fb-f').textContent       = '';
  document.getElementById('modal-funil').style.display = 'flex';
}

function saveFunil() {
  const nome = document.getElementById('f-funil-nome').value.trim();
  if (!nome) { document.getElementById('fb-f').textContent = 'Nome obrigatório'; return; }
  if (editFid) {
    const f = getFunil(editFid); if (f) f.nome = nome;
  } else {
    const id = 'f' + Date.now();
    cfg.funis.push({id, nome, etapas:[
      {id:'e'+Date.now(),     nome:'Novo contato'},
      {id:'e'+(Date.now()+1), nome:'Fechado'},
      {id:'e'+(Date.now()+2), nome:'Perdido'}
    ]});
    funilAtivo = id;
  }
  saveCfg();
  closeM('modal-funil');
  renderAll();
}

function openEtapaModal(fid, eid = null) {
  editEfid = fid;
  editEid  = eid;
  const e  = eid ? getEtapa(fid, eid) : null;
  document.getElementById('me-title').textContent  = eid ? 'Editar etapa' : 'Nova etapa';
  document.getElementById('f-etapa-nome').value    = e ? e.nome : '';
  document.getElementById('modal-etapa').style.display = 'flex';
}

function saveEtapa() {
  const nome  = document.getElementById('f-etapa-nome').value.trim();
  if (!nome) return;
  const funil = getFunil(editEfid);
  if (!funil) return;
  if (editEid) {
    const e = funil.etapas.find(x => x.id === editEid); if (e) e.nome = nome;
  } else {
    funil.etapas.push({id:'e'+Date.now(), nome});
  }
  saveCfg();
  closeM('modal-etapa');
  renderFunil();
}

function openUserModal() {
  document.getElementById('f-user-nome').value = '';
  document.getElementById('modal-user').style.display = 'flex';
}

function saveUser() {
  const nome = document.getElementById('f-user-nome').value.trim();
  if (!nome) return;
  cfg.usuarios.push({id:'u'+Date.now(), nome});
  saveCfg();
  closeM('modal-user');
  renderConfig();
  renderUbtns();
}

function delFunil(id) {
  if (!confirm('Apagar funil? Contatos associados ficarão sem funil.')) return;
  cfg.funis = cfg.funis.filter(f => f.id !== id);
  if (funilAtivo === id && cfg.funis.length) funilAtivo = cfg.funis[0].id;
  saveCfg(); renderAll();
}

function delEtapa(fid, eid) {
  if (!confirm('Apagar etapa?')) return;
  const f = getFunil(fid); if (f) f.etapas = f.etapas.filter(e => e.id !== eid);
  saveCfg(); renderAll();
}

function delUser(id) {
  if (!confirm('Remover usuário?')) return;
  cfg.usuarios = cfg.usuarios.filter(u => u.id !== id);
  saveCfg(); renderConfig(); renderUbtns();
}

// ── HEADER USER BTNS ───────────────────────────────────
function renderUbtns() {
  document.getElementById('ubtns').innerHTML =
    `<button class="hdr-ubtn${userAtivo==='todos'?' on':''}" onclick="setUser('todos')">Todos</button>` +
    cfg.usuarios.map(u =>
      `<button class="hdr-ubtn${userAtivo===u.id?' on':''}" onclick="setUser('${u.id}')">${u.nome}</button>`
    ).join('');
}

function setUser(id) { userAtivo = id; renderUbtns(); renderAll(); }

// ── MODAL HELPERS ──────────────────────────────────────
function closeM(id) { document.getElementById(id).style.display = 'none'; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape')
    document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');
});

function setFb(id, msg, type) {
  const el = document.getElementById(id);
  if (el) { el.textContent = msg; el.className = 'fb ' + type; }
}

// ── RENDER ALL ─────────────────────────────────────────
function renderAll() {
  renderFunil();
  renderContatos();
  renderUbtns();
}

// ── INIT ───────────────────────────────────────────────
loadCfg();
renderUbtns();
doSync();
</script>
</body>
</html>
